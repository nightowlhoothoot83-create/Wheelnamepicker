name: Indexing integrity
on:
  pull_request:
  push:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Check worker syntax
        run: node --input-type=module --check < _worker.js
      - name: Guard canonical rewriting
        run: node scripts/canonical-worker-regression.mjs
      - name: Validate indexing and value content
        run: node scripts/validate-indexing-integrity.mjs
