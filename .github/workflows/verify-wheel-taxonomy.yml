name: Verify Wheel card taxonomy
on:
  push:
    branches: [repair/final-adsense-visual-mobile-20260830]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify distinct card semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('index.html').read_text(encoding='utf-8')
          start=h.index('<!-- WHEEL USE CASES:')
          split=h.index('<!-- OTHER TOOLS:', start)
          end=h.index('<!-- AD SLOT TOP -->', split)
          use=h[start:split]
          tools=h[split:end]
          assert 'Popular Wheel Use Cases' in use
          assert 'href=' not in use
          assert 'location.href' not in use
          for mode in ('chores','names','custom'):
              assert f"selectModeById('{mode}')" in use
          assert 'Other Random Tools' in tools
          for route in ('/coin-toss','/dice-roller','/lucky-dip'):
              assert f'href="{route}"' in tools
          assert 'selectModeById' not in tools
          assert 'These open separate tools' in tools
          print('PASS: use-case actions and separate-tool navigation are distinct and correctly routed')
          PY
