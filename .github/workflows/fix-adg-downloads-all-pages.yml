name: Fix ADG Downloads all pages
on:
  push:
    branches:
      - fix/footer-adg-downloads-all-pages
permissions:
  contents: write
jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/footer-adg-downloads-all-pages
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply footer consistency repair
        run: python scripts/fix-adg-downloads-all-pages.py
      - name: Commit repaired worker
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _worker.js
          git diff --cached --quiet && exit 0
          git commit -m "Render ADG Downloads logo across every page"
          git push origin HEAD:fix/footer-adg-downloads-all-pages
